<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/df6d6ad47f.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="profile-card">
        <div class="image-card">
            <img src="/assets/images/profile.jpg" alt="Manikanta">
        </div>
        <div class="profile-content-card">
            <div class="profile-name">Manikanta</div>
            <div class="profile-role">Frontend Developer</div>
            <div class="profile-icons">
                <i class="fa-brands fa-facebook-f fb"></i>
                <i class="fa-brands fa-twitter tw"></i>
                <i class="fa-brands fa-instagram ig"></i>
                <i class="fa-brands fa-youtube yt"></i>
            </div>
            <div class="profile-buttons">
                <button type="submit">Subscribe</button>
                <button type="submit">Message</button>
            </div>
            <div class="profile-interaction">
                <div class="likes">
                    <i class="fa-regular fa-heart"></i>
                    <p>60k</p>
                </div>
                <div class="comments">
                    <i class="fa-regular fa-comment"></i>
                    <p>20k</p>
                </div>
                <div class="share">
                    <i class="fa-solid fa-share"></i>
                    <p>12k</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
